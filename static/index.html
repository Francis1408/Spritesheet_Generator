<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TESTE</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div id="settings-modal" class="window-modal">
        <div class="window-box">

            <!--- Modal Header --->
            <div class="window-header">

                <!--- Title --->
                <h2 class="modal-title">Diffusion settings</h2>

                <!-- Buttons on the right-->
                 <div class="window-header-right">
                    <button class="modal-btn" data-action="close">X</button>
                 </div>
            </div>


            <!--- Content--->
            <div class="modal-settings-body">
                <form id="diffusion-settings-form">

                    <label for="precision">PRECISION:</label>
                    <select name="precision" id="precision">
                        <option value="fp16">fp16</option>
                        <option value="fp32">fp32</option>
                    </select>

                    <label for="step">STEPS:</label>
                    <input type="number" id="step" name="step" value="30">

                    <label for="guidance">GUIDANCE:</label>
                    <input type="number" id="guidance" name="guidance" value="7.5">
                    
                    <label for="cn_scale">CN SCALE:</label>
                    <input type="number" id="cn_scale" name="cn_scale" value="30">

                    <label for="seed">SEED:</label>
                    <input type="number" id="seed" name="seed" value="30">

                    <label for="num_samples">NUM SAMPLES:</label>
                    <input type="number" id="num_samples" name="num_samples" value="1">
                    
                    <label for="reduce">REDUCE:</label>
                    <select name="reduce" id="reduce">
                        <option value="median">Median</option>
                        <option value="mean">Mean</option>
                        <option value="mode">Mode</option>
                    </select>
                </form>
            </div>
        </div>
    </div>

    <header>
        <h2>HEADER</h2>
        <button id="diffusion-settings">OPEN</button>
    </header>

    <main>

        <section class="image-area" data-step="spritesheet">
            <div class="image-row">
                <p>Front</p>
                <div class="dropzone" id="front">
                    <button class="remove-button">X</button>
                    <p>Drop here</p>
                </div>
            </div>
            
            <div class="image-row">
                <p>Back</p>
                <div class="dropzone" id="back">
                    <button class="remove-button">X</button>
                    <p>Drop here</p>
                </div>
            </div>
            
            <div class="image-row">
                <p>Left</p>
                <div class="dropzone" id="left">
                    <button class="remove-button">X</button>
                    <p>Drop here</p>
                </div>
            </div>
            
            <div class="image-row">
                <p>Right</p>
                <div class="dropzone" id="right">
                    <button class="remove-button">X</button>
                    <p>Drop here</p>
                </div>
            </div>
        </section>
        
        <section class="captioner-area" data-step="captioner">
            
            <section data-step="captioner_vlm">
                <div class="previews"></div>
            </section>
            
            <section data-step="captioner_llm">
                <textarea class="caption-text" rows="10"></textarea>
            </section>
            
            <div class="image-row">
                <div class="dropzone" id="output">
                    <p>Output</p>
                </div>
            </div>
            <p id="error">NORMAL</p>
            
        </section>
        
        
        <section class="diffusion-area" data-step="diffusion">
            <div class="output" id="output">
                <p>Output here</p>
            </div>
            <div class="output" id="output">
                <p>Output here</p>
            </div>
            <label for="options">Choose an upscale</label>
            <select name="options" id="upscale-option"></select>
        </section>
    </main>

    <footer>
        <button id="run-button">Run</button>
        <button id="restart-button">Restart</button>
    </footer>
        
    <script src="app.js"></script>
</body>
</html>
