<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TESTE</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="image-area">
        <div class="image-row">
            <p>Front</p>
            <div class="dropzone" id="front">
                <p>Drop here</p>
            </div>
        </div>
        
        <div class="image-row">
            <p>Back</p>
            <div class="dropzone" id="back">
                <p>Drop here</p>
            </div>
        </div>
            
        <div class="image-row">
            <p>Left</p>
            <div class="dropzone" id="left">
                <p>Drop here</p>
            </div>
        </div>

        <div class="image-row">
            <p>Right</p>
            <div class="dropzone" id="right">
                <p>Drop here</p>
            </div>
        </div>
    </div>

    <div class="captioner-area">
        <button id="run-button">Run</button>
        <textarea id="caption-text" rows="10"></textarea>
    </div>


    <div class="diffusion-area"></div>
    
    <script src="app.js"></script>
</body>
</html>
